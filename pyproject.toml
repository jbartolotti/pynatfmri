[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pynatfmri"
version = "0.1.0"
description = "A Python library for neuroimaging fMRI connectivity analysis"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "J. Bartolotti", email = "j186b025@gmail.com"}
]
keywords = ["fMRI", "neuroimaging", "connectivity", "brain imaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "nibabel>=3.2",
    "nilearn>=0.9",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
    "black>=21.0",
    "flake8>=3.9",
    "mypy>=0.910",
    "sphinx>=4.0",
]

[project.urls]
Homepage = "https://github.com/jbartolotti/pynatfmri"
Documentation = "https://github.com/jbartolotti/pynatfmri#readme"
Repository = "https://github.com/jbartolotti/pynatfmri.git"
Issues = "https://github.com/jbartolotti/pynatfmri/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src/pynatfmri --cov-report=html"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
